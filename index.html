<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Állású Kapcsolók</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #1e1e24;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Középső konténer */
        #switchesContainer {
            background-color: #2b2b36;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Egy sor (Név + Kapcsoló) - Teljes szélességű sáv */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-radius: 10px;
            background-color: #57606f; /* Alapértelmezett: Szürke */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .switch-label {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            user-select: none;
        }

        /* 3 állású kapcsoló téglalapja */
        .tri-switch {
            position: relative;
            width: 90px;
            height: 34px;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            cursor: pointer;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Kattintható zónák a kapcsolón belül */
        .click-zone {
            width: 33.33%;
            height: 100%;
            z-index: 2;
        }

        /* A mozgó gomb (pöcök) */
        .knob {
            position: absolute;
            top: 3px;
            left: 31px;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background-color: #ffffff;
            transition: left 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* BALRA: PIROS SOR */
        .switch-row[data-state="left"] {
            background-color: #e74c3c;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        .switch-row[data-state="left"] .tri-switch .knob {
            left: 3px;
        }

        /* KÖZÉPEN: SZÜRKE SOR */
        .switch-row[data-state="center"] {
            background-color: #57606f;
            box-shadow: 0 4px 15px rgba(87, 96, 111, 0.3);
        }
        .switch-row[data-state="center"] .tri-switch .knob {
            left: 31px;
        }

        /* JOBBRA: ZÖLD SOR */
        .switch-row[data-state="right"] {
            background-color: #27ae60;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }
        .switch-row[data-state="right"] .tri-switch .knob {
            left: 59px;
        }
    </style>
</head>
<body>

    <div id="switchesContainer"></div>

    <script>
        // ==========================================
        // ITT TUDOD KÖNNYEDÉN ÁTÍRNI A 9 NEVET:
        // ==========================================
        const kapcsoloNevek = [
            "Hála",
            "Laza Hangulat",
            "Na:szó,idő, aján,szívesség, érint",
            "Ni:szó,idő, aján,szívesség, érint",
            "Edzés",
            "Kaja Ist/Soll",
            "Kommunikáció",
            "Pénz",
            "Nyelvek",
            "Elengeded a nem szüks?"
        ];

        const container = document.getElementById("switchesContainer");

        // Kapcsolók legenerálása a lista alapján
        kapcsoloNevek.forEach((nev, index) => {
            const row = document.createElement("div");
            row.className = "switch-row";
            row.dataset.state = "center"; // Alapértelmezett állapot: közép (szürke)

            const label = document.createElement("span");
            label.className = "switch-label";
            label.textContent = nev;

            const switchEl = document.createElement("div");
            switchEl.className = "tri-switch";
            switchEl.dataset.index = index;

            // 3 kattintható zóna (Bal, Közép, Jobb)
            const states = ["left", "center", "right"];
            states.forEach(state => {
                const zone = document.createElement("div");
                zone.className = "click-zone";
                zone.addEventListener("click", () => {
                    row.dataset.state = state; // A teljes sor állapota változik
                });
                switchEl.appendChild(zone);
            });

            // Mozgó pöcök
            const knob = document.createElement("div");
            knob.className = "knob";
            switchEl.appendChild(knob);

            row.appendChild(label);
            row.appendChild(switchEl);
            container.appendChild(row);
        });
    </script>

</body>
</html>
