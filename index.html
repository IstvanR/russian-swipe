<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Állású Kapcsolók</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2b2b36;
            color: #ffffff;
            min-height: 100vh;
            width: 100%;
        }

        #switchesContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0;
        }

        .switch-row {
            width: 100%;
            min-height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 12px;
            padding-left: 22px;
            padding-right: 0;
            background-color: #57606f;
            transition: background-color 0.25s ease;
        }

        .switch-label {
            display: flex;
            align-items: center;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.25;
            color: #ffffff;
            user-select: none;
        }

        .tri-switch {
            position: relative;
            flex-shrink: 0;
            width: 154px; 
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: inset 2px 0 6px rgba(0, 0, 0, 0.25);
        }

        .click-zone {
            width: 33.33%;
            height: 100%;
            z-index: 2;
        }

        .knob {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: 46px;
            border-radius: 4px;
            background-color: #ffffff;
            transition: left 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* BALRA: PIROS SOR */
        .switch-row[data-state="left"] {
            background-color: #e74c3c;
        }
        .switch-row[data-state="left"] .tri-switch .knob {
            left: 4px;
        }

        /* KÖZÉPEN: SZÜRKE SOR */
        .switch-row[data-state="center"] {
            background-color: #57606f;
        }
        .switch-row[data-state="center"] .tri-switch .knob {
            left: calc(50% - 23px);
        }

        /* JOBBRA: ZÖLD SOR */
        .switch-row[data-state="right"] {
            background-color: #27ae60;
        }
        .switch-row[data-state="right"] .tri-switch .knob {
            left: calc(100% - 50px);
        }
    </style>
</head>
<body>

    <div id="switchesContainer"></div>

    <script>
        const kapcsoloNevek = [
            "Hála",
            "Laza Hangulat",
            "Na:szó,idő,aján,szíves,érint",
            "Ni:szó,idő,aján,szíves,érint",
            "Edzés",
            "Kaja Ist/Soll",
            "Kommunikáció",
            "Pénz",
            "Nyelvek",
            "Rend / tisztaság",
            "Elengeded a nem szükségest?"
        ];

        const container = document.getElementById("switchesContainer");

        kapcsoloNevek.forEach((nev, index) => {
            const row = document.createElement("div");
            row.className = "switch-row";
            row.dataset.state = "center";

            const label = document.createElement("span");
            label.className = "switch-label";
            label.textContent = nev;

            const switchEl = document.createElement("div");
            switchEl.className = "tri-switch";
            switchEl.dataset.index = index;

            const states = ["left", "center", "right"];
            states.forEach(state => {
                const zone = document.createElement("div");
                zone.className = "click-zone";
                zone.addEventListener("click", () => {
                    row.dataset.state = state;
                });
                switchEl.appendChild(zone);
            });

            const knob = document.createElement("div");
            knob.className = "knob";
            switchEl.appendChild(knob);

            row.appendChild(label);
            row.appendChild(switchEl);
            container.appendChild(row);
        });
    </script>

</body>
</html>
