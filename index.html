<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Állású Kapcsolók</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #1e1e24;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Középső konténer */
        #switchesContainer {
            background-color: #2b2b36;
            padding: 25px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Egy sor (Név + Kapcsoló) */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #3c3c4a;
        }

        .switch-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .switch-label {
            font-size: 16px;
            font-weight: 500;
            user-select: none;
        }

        /* 3 állású kapcsoló pályája */
        .tri-switch {
            position: relative;
            width: 90px;
            height: 34px;
            background-color: #18181f;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            cursor: pointer;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }

        /* Kattintható zónák a kapcsolón belül */
        .click-zone {
            width: 33.33%;
            height: 100%;
            z-index: 2;
        }

        /* A mozgó gomb (pöcök) */
        .knob {
            position: absolute;
            top: 3px;
            left: 31px; /* Alapértelmezett: Közép */
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #ffffff; /* Középen fehér */
            transition: left 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), background-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            z-index: 1;
        }

        /* BALRA: PIROS */
        .tri-switch[data-state="left"] .knob {
            left: 3px;
            background-color: #ff4757;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.8);
        }

        /* KÖZÉPEN: FEHÉR */
        .tri-switch[data-state="center"] .knob {
            left: 31px;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* JOBBRA: ZÖLD */
        .tri-switch[data-state="right"] .knob {
            left: 59px;
            background-color: #2ed573;
            box-shadow: 0 0 12px rgba(46, 213, 115, 0.8);
        }
    </style>
</head>
<body>

    <div id="switchesContainer"></div>

    <script>
        // ==========================================
        // ITT TUDOD KÖNNYEDÉN ÁTÍRNI A NEVEKET:
        // ==========================================
        const kapcsoloNevek = [
            "1. Kapcsoló neve",
            "2. Kapcsoló neve",
            "3. Kapcsoló neve",
            "4. Kapcsoló neve",
            "5. Kapcsoló neve",
            "6. Kapcsoló neve",
            "7. Kapcsoló neve",
            "8. Kapcsoló neve",
            "9. Kapcsoló neve",
            "10. Kapcsoló neve"
        ];

        const container = document.getElementById("switchesContainer");

        // Kapcsolók legenerálása a lista alapján
        kapcsoloNevek.forEach((nev, index) => {
            const row = document.createElement("div");
            row.className = "switch-row";

            const label = document.createElement("span");
            label.className = "switch-label";
            label.textContent = nev;

            const switchEl = document.createElement("div");
            switchEl.className = "tri-switch";
            switchEl.dataset.state = "center"; // Induláskor középen van (fehér)
            switchEl.dataset.index = index;

            // 3 kattintható zóna (Bal, Közép, Jobb)
            const states = ["left", "center", "right"];
            states.forEach(state => {
                const zone = document.createElement("div");
                zone.className = "click-zone";
                zone.addEventListener("click", () => {
                    switchEl.dataset.state = state;
                });
                switchEl.appendChild(zone);
            });

            // Mozgó pöcök
            const knob = document.createElement("div");
            knob.className = "knob";
            switchEl.appendChild(knob);

            row.appendChild(label);
            row.appendChild(switchEl);
            container.appendChild(row);
        });
    </script>

</body>
</html>
